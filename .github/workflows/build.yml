name: OS Build Check

on:
  push:
    branches: [ "main" ]
    tags: [ "v*-pre.*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Dependencies
      # gcc-multilib is needed to compile 32-bit code on a 64-bit runner
      run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib nasm xorriso grub-pc-bin grub-common mtools qemu-system-x86

    - name: Build OS
      run: make

    - name: Build x86_64 long-mode checkpoint
      run: make x86_64-iso

    - name: Test x86_64 memory-map normalization
      run: make x86_64-memory-test

    - name: Build Multiboot module reservation test image
      run: make x86_64-module-test-iso

    - name: Record QEMU version
      run: qemu-system-x86_64 --version

    - name: Boot-check x86_64 serial console
      run: python3 tests/qemu_serial_smoke.py build/x86_64/lolos-x86_64.iso regular --timeout 60

    - name: Boot-check x86_64 exceptions and page protections
      run: |
        python3 tests/qemu_serial_smoke.py build/x86_64/lolos-x86_64.iso exception-ud --timeout 60
        python3 tests/qemu_serial_smoke.py build/x86_64/lolos-x86_64.iso exception-pf --timeout 60
        python3 tests/qemu_serial_smoke.py build/x86_64/lolos-x86_64.iso exception-lowmem --timeout 60
        python3 tests/qemu_serial_smoke.py build/x86_64/lolos-x86_64.iso exception-guard --timeout 60
        python3 tests/qemu_serial_smoke.py build/x86_64/lolos-x86_64.iso exception-ro --timeout 60
        python3 tests/qemu_serial_smoke.py build/x86_64/lolos-x86_64.iso exception-nx --timeout 60

    - name: Boot-check Multiboot module reservations
      run: |
        python3 tests/qemu_serial_smoke.py build/x86_64/lolos-x86_64-module-test.iso module --timeout 60
        python3 tests/qemu_serial_smoke.py build/x86_64/lolos-x86_64-module-test.iso exception-module --timeout 60

    - name: Package release ISOs and checksums
      run: make release-assets

    - name: Verify Binary Exists
      run: |
        if [ ! -f myos.bin ]; then
          echo "Build failed: myos.bin was not created."
          exit 1
        fi
    - name: Upload packaged ISO artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LolOS-ISO-packages
        path: dist/
        if-no-files-found: error
        retention-days: 14

  publish-prerelease:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout tagged source
      uses: actions/checkout@v4

    - name: Download packaged ISO artifacts
      uses: actions/download-artifact@v4
      with:
        name: LolOS-ISO-packages
        path: dist/

    - name: Publish GitHub prerelease
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          dist/lolos-32bit-reference.iso \
          dist/lolos-x86_64-checkpoint.iso \
          dist/SHA256SUMS.txt \
          --verify-tag \
          --title "LolOS ${GITHUB_REF_NAME} — x86_64 migration checkpoint" \
          --notes-file .github/release-notes.md \
          --prerelease \
          --latest=false
