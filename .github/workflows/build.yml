name: OS Build Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Dependencies
      # gcc-multilib is needed to compile 32-bit code on a 64-bit runner
      run: |
          sudo apt-get update
          sudo apt-get install -y nasm xorriso grub-pc-bin grub-common mtools

    - name: Build OS
      run: make

    - name: Build x86_64 long-mode checkpoint
      run: make x86_64-iso

    - name: Verify Binary Exists
      run: |
        if [ ! -f myos.bin ]; then
          echo "Build failed: myos.bin was not created."
          exit 1
        fi
    - name: Upload OS Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LolOs-Binary
        path: myos.bin
        retention-days: 7

    - name: Upload x86_64 ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LolOS-x86_64-Checkpoint
        path: build/x86_64/lolos-x86_64.iso
        retention-days: 7
